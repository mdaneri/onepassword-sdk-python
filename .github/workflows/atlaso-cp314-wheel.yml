name: Build Atlaso CPython 3.14 wheel

on:
  pull_request:
    paths:
      - .github/workflows/atlaso-cp314-wheel.yml
      - src/release/ATLASO-CP314.md
      - src/release/atlaso-cp314-build-requirements.txt
      - src/release/scripts/build-atlaso-cp314-wheel.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/atlaso-cp314-wheel.yml
      - src/release/ATLASO-CP314.md
      - src/release/atlaso-cp314-build-requirements.txt
      - src/release/scripts/build-atlaso-cp314-wheel.py
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified immutable compatibility release
        required: true
        default: false
        type: boolean
      live_validation_json:
        description: Canonical sanitized live-validation JSON; required for publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: atlaso-cp314-wheel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Independent build ${{ matrix.replica }}
    strategy:
      fail-fast: true
      matrix:
        replica: [a, b]
    runs-on: windows-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out the build recipe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up standard CPython 3.14 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
          allow-prereleases: false
      - name: Install exact build tools
        shell: pwsh
        env:
          PIP_CONFIG_FILE: ${{ runner.temp }}\empty-pip.ini
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          New-Item -ItemType File -Path $env:PIP_CONFIG_FILE | Out-Null
          python -I -m pip install `
            --require-hashes `
            --no-deps `
            --requirement src/release/atlaso-cp314-build-requirements.txt
      - name: Build and verify the wheel
        shell: pwsh
        run: |
          python -I src/release/scripts/build-atlaso-cp314-wheel.py build `
            --output "${{ runner.temp }}\candidate-${{ matrix.replica }}"
      - name: Scan all candidate inputs and outputs with Microsoft Defender
        shell: pwsh
        run: |
          $defender = Get-ChildItem `
            -LiteralPath 'C:\ProgramData\Microsoft\Windows Defender\Platform' `
            -Filter MpCmdRun.exe -Recurse -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $defender) { throw 'Microsoft Defender command-line scanner is unavailable.' }
          & $defender.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender signature update failed: $LASTEXITCODE" }
          & $defender.FullName -Scan -ScanType 3 -File "${{ runner.temp }}\candidate-${{ matrix.replica }}"
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender rejected the candidate: $LASTEXITCODE" }
      - name: Upload the independent candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlaso-cp314-${{ matrix.replica }}
          path: ${{ runner.temp }}\candidate-${{ matrix.replica }}
          if-no-files-found: error
          retention-days: 7

  reconcile:
    name: Reconcile independent candidates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out the assembly recipe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download candidate A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlaso-cp314-a
          path: ${{ runner.temp }}/candidate-a
      - name: Download candidate B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlaso-cp314-b
          path: ${{ runner.temp }}/candidate-b
      - name: Require byte-identical output and assemble release metadata
        run: |
          python -I src/release/scripts/build-atlaso-cp314-wheel.py assemble \
            --first "${{ runner.temp }}/candidate-a" \
            --second "${{ runner.temp }}/candidate-b" \
            --output "${{ runner.temp }}/release"
      - name: Upload the reconciled release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlaso-cp314-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest and publish immutable release
    needs: reconcile
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Require protected main and enabled release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/${{ github.repository }}/branches/main" --jq .protected)" = true
          ! gh release view atlaso-wheel-v0.4.1-cp314.1 --repo "${{ github.repository }}"
      - name: Download the reconciled release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlaso-cp314-release
          path: ${{ runner.temp }}/release
      - name: Validate and record sanitized live evidence
        env:
          LIVE_VALIDATION_JSON: ${{ inputs.live_validation_json }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          wheel = root / 'onepassword_sdk-0.4.1-cp314-cp314-win_amd64.whl'
          evidence = json.loads(os.environ['LIVE_VALIDATION_JSON'])
          required = {
              'artifact_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
              'desktop_authorization': 'passed',
              'environment_access': 'passed',
              'secret_values_recorded': False,
          }
          if any(evidence.get(key) != value for key, value in required.items()):
              raise SystemExit('live validation does not match the exact artifact and required outcomes')
          if set(evidence) != set(required) | {'validated_at', 'validator'}:
              raise SystemExit('live validation contains unexpected fields')
          root.joinpath('live-validation.json').write_text(
              json.dumps(evidence, ensure_ascii=True, separators=(',', ':'), sort_keys=True) + '\n',
              encoding='utf-8', newline='\n')
          PY
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/onepassword_sdk-0.4.1-cp314-cp314-win_amd64.whl
      - name: Attest the SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/onepassword_sdk-0.4.1-cp314-cp314-win_amd64.whl
          sbom-path: ${{ runner.temp }}/release/sbom.spdx.json
      - name: Publish the immutable compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "${{ runner.temp }}/release-notes.md" <<'EOF'
          Temporary Atlaso compatibility artifact for Windows x86-64 CPython 3.14.

          This is not an official 1Password release and is not published to PyPI.
          It repackages the exact onepassword-sdk 0.4.1 PyPI source distribution,
          preserves the upstream MIT license, and is tracked by upstream issue #244
          and Atlaso issue #610.
          EOF
          gh release create atlaso-wheel-v0.4.1-cp314.1 \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --draft \
            --title 'Atlaso CPython 3.14 compatibility wheel for onepassword-sdk 0.4.1' \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            "${{ runner.temp }}/release/onepassword_sdk-0.4.1-cp314-cp314-win_amd64.whl" \
            "${{ runner.temp }}/release/provenance.json" \
            "${{ runner.temp }}/release/sbom.spdx.json" \
            "${{ runner.temp }}/release/live-validation.json" \
            "${{ runner.temp }}/release/LICENSE"
          gh release edit atlaso-wheel-v0.4.1-cp314.1 \
            --repo "${{ github.repository }}" \
            --draft=false
          test "$(gh release view atlaso-wheel-v0.4.1-cp314.1 \
            --repo "${{ github.repository }}" --json isImmutable --jq .isImmutable)" = true
